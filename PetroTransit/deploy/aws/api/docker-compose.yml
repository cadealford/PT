services:
  api:
    build:
      context: ../../../PetroTransit.API
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    expose:
      - "8080"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    depends_on:
      - api
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    restart: unless-stopped

