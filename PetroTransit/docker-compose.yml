services:
  db:
    image: postgres:16
    env_file:
      - .env
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: ./PetroTransit.API
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      - db
    restart: unless-stopped

  web:
    build:
      context: ./petro-transit-web
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
